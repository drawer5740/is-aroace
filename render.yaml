services:
  - type: web
    name: is-aroace-website-router
    runtime: node
    plan: free
    rootDir: website-router
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ROOT_DOMAIN
        value: is-aroace.l.cd
