services:
  - type: web
    name: is-aroace-website-router
    runtime: node
    plan: free
    buildCommand: npm --prefix website-router install --omit=dev
    startCommand: npm --prefix website-router start
    healthCheckPath: /health
    domains:
      - is-aroace.l.cd
      - "*.is-aroace.l.cd"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ROOT_DOMAIN
        value: is-aroace.l.cd
